services:
  # Banco Postgres local — mesmo provider do schema.prisma.
  db:
    image: postgres:16-alpine
    container_name: operis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: operis
    ports:
      - "5432:5432"
    volumes:
      - operis-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d operis"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Serviço one-shot: aplica as migrations do Prisma e roda o seed.
  # Sobe, gera o banco e encerra (não fica rodando).
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: operis-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      # host "db" = nome do serviço na rede do compose
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/operis?schema=public"
    restart: "no"

volumes:
  operis-db-data:
